[project]
name = "maintenance-agent"
version = "0.1.0"
description = "Async CLI work-order coordination"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.13.0",
  "dependency-injector>=4.41,<5",
  "langgraph>=1.2.14",
  "pydantic-settings>=2.0,<3",
]

[project.scripts]
maintenance-agent = "maintenance_agent.__main__:main"

[dependency-groups]
dev = [
  "poethepoet>=0.30,<1",
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.poe.tasks.auto-fix]
help = "Auto-fix what Ruff can (format + lint --fix)"
sequence = [
  { cmd = "uv run ruff format ." },
  { cmd = "uv run ruff check --fix ." },
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"maintenance_agent.skills" = ["*.md"]
